spring.application.name=inventario-tienda-tecnologica

# Puerto donde corre la aplicación backend
server.port=8080

# ==========================================
# Configuración de la base de datos PostgreSQL (Dinámico para Docker)
# ==========================================
# Usamos las variables exactas que el docker-compose inyecta en el contenedor
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ==========================================
# Configuración de JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formatea el SQL en la consola para que el Ing. evaluador lo lea de forma ordenada
spring.jpa.properties.hibernate.format_sql=true