version: '3.8'

services:
  database:
    image: postgres:16
    container_name: inventario-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - inventario-network
    # ¡AGREGADO!: Docker verificará internamente cuándo PostgreSQL ya acepta conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventario-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    image: inventario-backend:1.0
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      # CORREGIDO: Cambiado 'host.docker.internal' por 'database' (el nombre del servicio de arriba)
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    # CORREGIDO: Ahora espera de forma estricta que la base de datos esté sana (healthy)
    depends_on:
      database:
        condition: service_healthy
    networks:
      - inventario-network

  inventario-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario-frontend
    image: inventario-frontend:1.0
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - inventario-backend
    networks:
      - inventario-network

networks:
  inventario-network:
    driver: bridge

volumes:
  db_data: