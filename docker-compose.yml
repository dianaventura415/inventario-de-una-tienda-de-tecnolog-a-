version: '3.8'

services:
  database:
    image: postgres:16
    container_name: inventario-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - inventario-network



  inventario-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    image: inventario-backend:1.0
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - database
    networks:
      - inventario-network

  inventario-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario-frontend
    image: inventario-frontend:1.0
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - inventario-backend
    networks:
      - inventario-network

networks:
  inventario-network:
    driver: bridge

volumes:
  db_data:

